const listEl=document.getElementById('list');const nowEl=document.getElementById('now');
const playBtn=document.getElementById('play');let current=-1;let playing=false;
function build(){listEl.innerHTML='';
 for(const [g,idxs] of Object.entries(GROUPS)){
  const h=document.createElement('h2');h.textContent=g+'（'+idxs.length+'）';listEl.appendChild(h);
  for(const i of idxs){const d=DATA[i];
   const el=document.createElement('div');el.className='row'+(i===current?' active':'');el.dataset.i=i;
   const idx=document.createElement('span');idx.className='idx';idx.textContent=String(i+1).padStart(2,'0');
   const name=document.createElement('span');name.className='name';name.textContent=d.t;
   const meta=document.createElement('span');meta.className='meta';meta.textContent=d.d.toFixed(2)+'s · '+d.l;
   el.append(idx,name,meta);el.addEventListener('click',()=>play(i));listEl.appendChild(el);}}}
function play(i){if(i<0||i>=DATA.length)return;current=i;const d=DATA[i];

 nowEl.textContent=d.t+' · '+d.s;document.querySelectorAll('.row').forEach(r=>r.classList.toggle('active',+r.dataset.i===i));
 const r=document.querySelector('.row[data-i="'+i+'"]');if(r)r.scrollIntoView({block:'nearest'});}
function step(d){if(!DATA.length)return;current=(current+d+DATA.length)%DATA.length;play(current);}
function btn(){playBtn.textContent=playing?'⏸ 暂停':'▶ 播放';}
playBtn.onclick=()=>{if(!audio.src){step(1);return;}if(audio.paused){audio.play();}else{audio.pause();}};
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('vol').oninput=e=>audio.volume=parseFloat(e.target.value);audio.volume=0.85;
audio.onplay=()=>{playing=true;btn();};audio.onpause=()=>{playing=false;btn();};
audio.onended=()=>{playing=false;btn();if(document.getElementById('loop').checked){audio.currentTime=0;audio.play();return;}if(document.getElementById('autonext').checked)step(1);};
document.addEventListener('keydown',e=>{const t=(e.target.tagName||'').toLowerCase();if(t==='input')return;
 if(e.code==='Space'){e.preventDefault();playBtn.click();}else if(e.code==='ArrowRight'){e.preventDefault();step(1);}else if(e.code==='ArrowLeft'){e.preventDefault();step(-1);}});
